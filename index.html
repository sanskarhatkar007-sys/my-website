<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sanskar Web Studio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

nav{
    position:sticky;
    top:0;
    z-index:1000;
    background:#111827;
    padding:16px 10px;
    text-align:center;
}

nav h2{
    color:white;
    margin-bottom:10px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:5px 8px;
    font-size:14px;
}

.hero{
    min-height:85vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px 20px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
}

.hero h1{
    font-size:42px;
    margin-bottom:15px;
}

.hero p{
    max-width:600px;
    font-size:18px;
    line-height:1.6;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:13px 25px;
    background:#111827;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

section{
    padding:60px 20px;
    max-width:1000px;
    margin:auto;
}

.title{
    text-align:center;
    font-size:32px;
    margin-bottom:30px;
}

.about{
    text-align:center;
    max-width:700px;
    margin:auto;
    line-height:1.7;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:white;
    padding:28px 20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.card h3{
    margin-bottom:12px;
}

.card p{
    color:#667085;
    margin:8px 0;
}

.price{
    font-size:28px;
    margin:15px 0;
}

.skills{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.skill{
    background:white;
    padding:22px 10px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.07);
}

.projects{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.project{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.project h3{
    margin-bottom:10px;
}

.project p{
    color:#667085;
}

#pricing{
    background:#eef2ff;
    max-width:none;
}

#pricing .cards{
    max-width:1000px;
    margin:auto;
}

.contact{
    text-align:center;
}

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px;
}

@media(max-width:700px){

    .hero h1{
        font-size:34px;
    }

    .hero p{
        font-size:16px;
    }

    .cards,
    .skills,
    .projects{
        grid-template-columns:1fr;
    }

    nav a{
        font-size:13px;
        margin:4px;
    }

}

</style>

</head>

<body>


<!-- NAVIGATION -->

<nav>

<h2>Sanskar Web Studio</h2>

<a href="#home">Home</a>
<a href="#services">Services</a>
<a href="#about">About</a>
<a href="#skills">Skills</a>
